# Conteneur de l'application : sert les fichiers statiques.
# TLS et nom de domaine sont gérés par le reverse proxy du VPS (voir deploy/reverse-proxy.example.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les modules pdf.js sont en .mjs : il faut un type JavaScript pour qu'ils s'exécutent.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fichiers nommés avec un hash : immuables, cache d'un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri @asset_absent;
    }

    # Un script /assets/*.js absent est demandé par une ancienne version restée en cache sur
    # l'appareil (ses fichiers ont disparu au déploiement). Plutôt qu'un 404 qui casse l'app,
    # on renvoie un script de secours qui retire cette version et recharge la page.
    location @asset_absent {
        if ($uri ~ "\.m?js$") {
            rewrite ^ /stale-asset.js last;
        }
        return 404;
    }

    location = /stale-asset.js {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker, manifeste et page d'entrée : toujours revalidés, pour que les mises à jour arrivent.
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(png|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
