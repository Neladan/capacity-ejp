# Vhost du reverse proxy Docker « nginx » du VPS (pile /root/ejp-project), copie de
# /root/ejp-project/nginx/conf.d/capacity.ejpcotonou.com.conf.
# Le conteneur nginx joint l'app par le réseau Docker « web » : mon-catalogue-des-possibles:80.
# Première installation : n'ajouter le bloc 443 qu'une fois le certificat obtenu (voir README).
server {
    listen 80;
    listen [::]:80;
    server_name capacity.ejpcotonou.com;

    # Doit rester accessible en clair : c'est par là que certbot renouvelle.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capacity.ejpcotonou.com;

    ssl_certificate     /etc/letsencrypt/live/capacity.ejpcotonou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capacity.ejpcotonou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64k;

    location / {
        proxy_pass http://mon-catalogue-des-possibles:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
