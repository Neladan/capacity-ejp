# Exemple pour le nginx « reverse proxy » du VPS (hors conteneur), avec certbot.
# Domaine : capacity.ejpcotonou.com. Activation du TLS : sudo certbot --nginx -d capacity.ejpcotonou.com
server {
    listen 80;
    server_name capacity.ejpcotonou.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
